name: veylora

# Veylora - AI Autonomous Vulnerability Assessment Platform
# Brings up PostgreSQL, Redis, Neo4j and the API worker (optional), plus the
# web frontend. For a zero-dependency local run, the backend also works with
# SQLite + the in-process executor (see README).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apt
      POSTGRES_PASSWORD: apt_password
      POSTGRES_DB: apt
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4jdata:/data
    ports:
      - "7474:7474"
      - "7687:7687"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://apt:apt_password@postgres:5432/apt
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: change-me
      # Replace in production!
      JWT_SECRET: CHANGE_ME_development_secret_not_for_production
      DEV_OTP_RETURN: "true"
      EMAIL_ENABLED: "false"
      SEED_ADMIN_EMAIL: admin@secops.io
      SEED_ADMIN_PASSWORD: Admin@12345
      DEFAULT_SCAN_ADAPTERS: simulated-lab
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  neo4jdata: